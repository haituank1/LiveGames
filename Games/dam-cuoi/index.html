<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đám Cưới Online</title>
<script>
/* HỘP TỰ CHẨN ĐOÁN lúc khởi động (Nguyen gặp lỗi màn hình đỏ trống 3 lần
   2026-11-04 mà không cách nào nhìn vào máy anh ấy được): script inline này
   chạy TRƯỚC mọi file khác, ghi lại lỗi + mốc khởi động; nếu sau 7 giây game
   chưa sẵn sàng thì TỰ hiện hộp báo ngay trên màn hình game — đang dừng ở
   bước nào, lỗi gì — để chụp gửi là biết ngay nguyên nhân. Game khỏe thì
   hộp không bao giờ hiện. Mở ?diag=1 để xem hộp bất cứ lúc nào. */
window.__diag = { build: 'pipeline-b24', stage: 'html', errs: [], uiErr: '' };
(function () {
  var D = window.__diag;
  function rec(s) { D.errs.push(String(s).slice(0, 200)); if (D.errs.length > 4) D.errs.shift(); }
  window.addEventListener('error', function (e) { rec((e.message || 'loi script') + (e.filename ? ' @' + String(e.filename).split('/').pop() : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { rec('promise: ' + ((e.reason && e.reason.message) || e.reason)); });
  var ce = console.error.bind(console);
  console.error = function () { try { rec(Array.prototype.map.call(arguments, function (a) { return (a && a.message) || String(a); }).join(' ')); } catch (_) {} return ce.apply(null, arguments); };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  var t = 0;
  var iv = setInterval(function () {
    t++;
    var el = document.getElementById('bootdiag');
    if (!el) return;
    var force = /[?&]diag=1/.test(location.search);
    if (D.stage === 'config-ok' && !D.uiErr && !force) { el.style.display = 'none'; clearInterval(iv); return; }
    if (t < 7 && !force) return;
    var msg = D.stage === 'html' ? 'Chưa nạp được mã game — bản cập nhật có thể chưa về máy, hoặc thiếu file khi pull.'
      : D.stage === 'main-ok' ? 'Mã game đã nạp nhưng CHƯA KẾT NỐI được LiveBridge — kiểm tra cửa sổ LiveBridge có đang chạy không rồi tải lại trang game.'
      : D.stage === 'ws-ok' ? 'Đã nối LiveBridge nhưng áp cấu hình bị lỗi (xem dòng lỗi dưới).'
      : D.uiErr ? 'Cấu hình đã áp nhưng VẼ UI bị lỗi: ' + esc(D.uiErr)
      : 'Game đang chạy bình thường.';
    var bd = document.getElementById('board'), gd = document.getElementById('guide');
    var probe = ' · BXH display: ' + (bd ? JSON.stringify(bd.style.display) : '?') + ' · hướng dẫn: ' + (gd && gd.textContent ? gd.textContent.length + ' ký tự' : 'TRỐNG');
    el.innerHTML = (D.stage === 'config-ok' && !D.uiErr ? '✔ ' : '⚠ ') + 'build ' + D.build + ' · mốc: ' + D.stage + probe + '<br>' + msg + (D.errs.length ? '<br>Lỗi gần nhất: ' + esc(D.errs[D.errs.length - 1]) : '');
    el.style.display = 'block';
  }, 1000);
})();
</script>
<style>
  :root{--u0:4px;--k:1.2;--u:var(--u0);--side:0px}
  #left,#side,#mc,#queue{--u:calc(var(--u0)*var(--k))}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a0a18;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100vw;height:100vh;overflow:hidden;background:#2a0a18}
  #bootdiag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:99999;max-width:94%;background:rgba(20,0,8,.93);color:#ffd9e2;border:1px solid #ff5b7f;border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.55;text-align:center;display:none;pointer-events:none}
  /* ---------- Phòng cưới rộng + camera lia ---------- */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#430b18}
  #bgfull{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;z-index:1}
  /* V5 — grade dịu màu sảnh (chỉ CSS, không JS, không đụng effects.js của nv1):
     lớp phủ xám-mận nhạt CHỈ ở vùng sảnh dưới (mờ dần từ y 36% xuống, trong
     suốt hoàn toàn ở vùng sân khấu phía trên) nên vàng/hồng bớt chói mà sân
     khấu vẫn sáng; hai bên tối nhẹ làm điểm nghỉ mắt. Nằm dưới #people (z 3)
     nên chỉ dịu màu NỀN, không làm tối / xỉn màu nhân vật. Không dùng
     backdrop-filter để chạy được cả trên CEF cũ của OBS. */
  /* V12b: toi 2 ben manh hon (.24 -> .32) de sanh toi hon tham cung do
     cao — truoc day sanh sang hon tham toi -52 do sang o giua tham do
     nen cam thach sang + khach dung 2 ben deu sang. Lop nay nam duoi
     #people nen chi toi nen, khong toi nguoi. */
  #grade{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(24,12,22,.32),rgba(24,12,22,0) 15%,rgba(24,12,22,0) 85%,rgba(24,12,22,.32)),
      linear-gradient(180deg,transparent 36%,rgba(66,54,66,.07) 60%,rgba(60,48,58,.15) 100%)}
  #people{position:absolute;inset:0;z-index:3}
  /* V12b vong 2 — #spot NAM TRONG #world (the-gioi) chu khong phai man
     hinh: hop cu (top 18%, cao 27%) dat tam radial o the-gioi y ~41%,
     roi ngoai khung khi camera zoom vao cap (the-gioi y ~61%). Doi hop
     V12b bo sung (2026-11-06, anh 26): doi hop xuong top 44% (bao
     the-gioi y 44-71%) de tam radial (50% 88%) roi y ~68% (duoi cap,
     tren tham) thay vi y ~62% — tam cu nam ngay cau thang/buc sang
     san, chong voi tiergrade + aislebeam tao mang vang phang. Cap
     (y ~61%) van nam trong quang spot (cach tam ~7% the-gioi). */
  #spot{position:absolute;left:50%;top:44%;width:31%;height:27%;transform:translateX(-50%);pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 88%,rgba(255,225,150,var(--spot-a)),rgba(255,225,150,.12) 42%,transparent 72%);
    opacity:0;transition:opacity .8s}
  #spot.on{opacity:1;animation:spotPulse 2.6s ease-in-out infinite}
  /* V3 (nv3, 2026-11-05): cap dang dien tren san khau phai nhin thay ngay.
     #stage.couple-on bat khi cap toi san khau (main.js syncStageSpotlight),
     tat khi san khau trong: spot + beams manh hon, sảnh xung quanh tối nhẹ
     (vignette #stageDim), tên cặp to hiện giữa trên sân khấu (#coupleName).
     Khung BXH/so mung/bang lenh/hang cho/MC o z-index 2000+ nen nam tren
     lop vignette (z 4), khong bi toi theo. */
  #stageDim{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .8s;
    background:radial-gradient(ellipse 62% 48% at 50% 40%,transparent 52%,rgba(26,2,14,.38) 100%)}
  #stage.couple-on #stageDim{opacity:1}
  #stage.couple-on #spot{width:34%;opacity:1;
    background:radial-gradient(ellipse at 50% 88%,rgba(255,232,170,.45),rgba(255,225,150,.18) 42%,transparent 72%)}
  #stage.couple-on #beams{opacity:1}
  #coupleName{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.92);z-index:2140;pointer-events:none;
    max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:linear-gradient(100deg,rgba(90,8,40,.92),rgba(150,20,70,.92) 55%,rgba(90,8,40,.92));
    color:#ffe9a8;font-weight:800;letter-spacing:.4px;font-size:calc(var(--u0)*3.8);
    padding:calc(var(--u0)*1.1) calc(var(--u0)*3.2);border-radius:999px;
    border:2px solid rgba(255,215,106,.95);box-shadow:0 6px 24px rgba(120,0,40,.55),0 0 22px rgba(255,200,80,.55);
    opacity:0;transition:opacity .4s,transform .4s;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #stage.couple-on #coupleName{opacity:1;transform:translate(-50%,-50%) scale(1)}
  /* Ten cap dung chung o voi banner (tren dau cap, duoi bong MC) — chi
     hien khi banner tat, tranh chong nhau: banner hien 4.6s dau thi ten
     an, banner tat thi ten hien den het buoi le. */
  #stage.couple-on.banner-on #coupleName{opacity:0;transform:translate(-50%,-50%) scale(.92)}
  @keyframes spotPulse{0%,100%{opacity:.75}50%{opacity:1}}
  .person.pairfx .figwrap{position:relative;filter:drop-shadow(0 0 10px rgba(255,120,180,.9)) drop-shadow(0 0 22px rgba(255,190,90,.8)) drop-shadow(0 0 40px rgba(255,160,60,.35))}
  .person.pairfx::before{content:'';position:absolute;left:50%;bottom:-4%;width:150%;aspect-ratio:1;transform:translateX(-50%);
    border-radius:50%;border:3px solid rgba(255,150,200,.85);animation:pairRing 1.15s ease-out infinite;pointer-events:none}
  .person.pairfx .figwrap::after{content:'';position:absolute;left:50%;bottom:-9%;width:150%;aspect-ratio:1;transform:translateX(-50%);
    border-radius:50%;border:3px solid rgba(255,214,110,.9);animation:pairRing 1.15s .57s ease-out infinite;pointer-events:none}
  .person.pairfx::after{content:'';position:absolute;left:50%;top:42%;width:180%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;
    border-radius:50%;pointer-events:none;
    /* V12 (2026-11-06): 235% -> 180%, alpha .55/.42 -> .35/.28, mask hep
       lai (68% -> 62%) — hao quang xoay conic truoc day cung voi tia xoay
       cua #beams tao thanh mat troi vang khoi lo sau cap, at het nen san
       khau. Van giu vong sang xoay quanh cap, chi nho va mo hon. */
    background:repeating-conic-gradient(from 0deg,rgba(255,214,100,.35) 0deg 9deg,transparent 9deg 22deg,rgba(255,150,200,.28) 22deg 28deg,transparent 28deg 45deg);
    -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 62%);mask-image:radial-gradient(circle,#000 30%,transparent 62%);
    animation:auraSpin 9s linear infinite}
  @keyframes auraSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes pairRing{from{transform:translateX(-50%) scale(.45);opacity:1}to{transform:translateX(-50%) scale(1.15);opacity:0}}
  .person.far .figwrap{animation-play-state:paused!important}
  .person.far .figwrap img.chibi{animation-play-state:paused!important}
  /* Anh sang 2.0 (Nguyen chot 2026-11-04): bo han kieu 1 tam gradient xoay
     tron phu ca man hinh (nhin mo + re) — thay bang TIA NANG xoe sau vom hoa
     (lac nhe +-2.2 do, khong quay vong) + 3 DEN CHIEU tu tren tran doi xuong
     san khau dang con lac cham, tia sang mem va chi tap trung o khu san khau */
  #beams{position:absolute;inset:0;opacity:0;transition:opacity 2s;pointer-events:none;overflow:hidden}
  #beams.on{opacity:1}
  #beams .rays{position:absolute;left:50%;top:30%;width:165%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from -26deg at 50% 50%, rgba(255,216,140,.12) 0deg 3.5deg, transparent 3.5deg 8.5deg);
    -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 60%);mask-image:radial-gradient(circle,#000 0%,transparent 60%);
    animation:raysway 12s ease-in-out infinite alternate}
  @keyframes raysway{from{transform:translate(-50%,-50%) rotate(-2.2deg)}to{transform:translate(-50%,-50%) rotate(2.2deg)}}
  #beams .spot{position:absolute;top:-5%;height:82%;width:34%;transform-origin:50% 0;mix-blend-mode:screen;filter:blur(6px);
    clip-path:polygon(45% 0,55% 0,97% 100%,3% 100%)}
  /* V12b: tia phai mo dan THEO HUONG TIA (sang o san khau, nhat dan
     xuong tham) — truoc day gradient sang nhat o DINH khung (y~0, tren
     ca san khau) va trong suot tu ~60% tro xuong, nguoc voi mo hinh
     "san khau la nguon". Gio dinh o 55% chieu cao tia (~y40% khung,
     ngay san khau), mo dan ca 2 phia, duoi mo dai toi 96% (~y74%). */
  #beams .spot.l{left:0;background:linear-gradient(to bottom,transparent 0%,rgba(255,244,214,.14) 32%,rgba(255,244,214,.50) 55%,rgba(255,244,214,.18) 74%,transparent 96%);animation:spotl 8.5s ease-in-out infinite alternate}
  #beams .spot.c{left:33%;background:linear-gradient(to bottom,transparent 0%,rgba(255,226,150,.10) 32%,rgba(255,226,150,.40) 55%,rgba(255,226,150,.14) 74%,transparent 96%);animation:spotc 7s ease-in-out infinite alternate}
  #beams .spot.r{right:0;background:linear-gradient(to bottom,transparent 0%,rgba(255,214,230,.12) 32%,rgba(255,214,230,.44) 55%,rgba(255,214,230,.16) 74%,transparent 96%);animation:spotr 9.5s ease-in-out infinite alternate}
  @keyframes spotl{from{transform:rotate(12deg)}to{transform:rotate(4deg)}}
  @keyframes spotc{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  @keyframes spotr{from{transform:rotate(-4deg)}to{transform:rotate(-12deg)}}
  #royalglow{position:absolute;inset:0;opacity:0;transition:opacity 2s;pointer-events:none;
    /* V12b: tam doi ve san khau/cap (50% 42%, truoc 50% 30% — tren ca
       san khau) + roi 2 nac doc (.18 -> .06 o 30% -> trong suot 55%):
       quang hoang gia van o dung cho sang nhat, mo dan ra xa. */
    background:radial-gradient(circle at 50% 42%,rgba(255,225,140,.18),rgba(255,225,140,.06) 30%,transparent 55%)}
  #royalglow.on{opacity:1;animation:pulseGlow 3.2s ease-in-out infinite}
  @keyframes pulseGlow{50%{opacity:.55}}
  /* ---------- Grade theo mốc sảnh (VĐ1) ----------
     Không vẽ lại nền, không sửa .webp: chỉ phủ màu/ánh sáng lên trên nền.
     #tiergrade + #aislebeam + .sidecarpet nằm TRONG #world, dưới #people
     (z-index 2 < 3) nên chỉ nhuộm nền, không che nhân vật; chúng đi theo
     camera vì cùng nằm trong #world. Mốc nào thì effects.js đặt
     data-tier lên #stage (qua E.setTier, main.js đã gọi sẵn ở refreshBg).
     --tg-stage: độ sáng vòm sân khấu · --tg-tint: màu phủ theo mốc
     --tg-side: tối nhẹ hai bên sảnh · --ab-op: tia sáng thảm giữa
     --sc-op: làm mờ nhẹ 2 dải thảm đỏ bên · --spot-a: độ mạnh đèn sân khấu */
  #stage{--tg-stage:.12;--tg-tint:rgba(255,196,130,.06);--tg-side:.08;--ab-op:.25;--sc-op:.35;--spot-a:.5}
  #stage[data-tier="0"]{--tg-stage:.12;--tg-tint:rgba(255,196,130,.06);--tg-side:.08;--ab-op:.25;--sc-op:.35;--spot-a:.5}
  #stage[data-tier="1"]{--tg-stage:.2;--tg-tint:rgba(255,150,190,.09);--tg-side:.12;--ab-op:.32;--sc-op:.5;--spot-a:.55}
  #stage[data-tier="2"]{--tg-stage:.3;--tg-tint:rgba(255,205,110,.11);--tg-side:.16;--ab-op:.42;--sc-op:.65;--spot-a:.6}
  #stage[data-tier="3"]{--tg-stage:.4;--tg-tint:rgba(255,190,140,.13);--tg-side:.2;--ab-op:.5;--sc-op:.8;--spot-a:.65}
  #stage[data-tier="4"]{--tg-stage:.4;--tg-tint:rgba(255,190,80,.12);--tg-side:.22;--ab-op:.5;--sc-op:.9;--spot-a:.7}
  /* V12b vong 3 — Giam cuong do (neo da dung, gio sang tap trung qua
     manh): --tg-stage moc 5 .5 -> .45 (moc 4 .45 -> .4, giu tien trinh);
     --ab-op moc 5 .75 -> .6 (moc 4 ve .5). */
  #stage[data-tier="5"]{--tg-stage:.45;--tg-tint:rgba(255,170,70,.08);--tg-side:.24;--ab-op:.6;--sc-op:.25;--spot-a:.75}
  #tiergrade{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      /* V12b bo sung (2026-11-06, anh 26): doi tam radial xuong y 64%
         (tren nguoi cap / dau tham) thay vi y 54% — tam cu nam dung
         vung buc san khau + cau thang (nen von sang vang, co canh
         thang) nen 4 lop sang chong len nhau tao thanh 1 mang vang
         phang hinh chu nhat quanh san khau, vay vang cua co dau chim
         luon vao nen. Tam moi o y 64% thi sang tap trung vao cap +
         tham duoi, buc/cau thang phia tren chi con duoi mo cua quang. */
      radial-gradient(ellipse 36% 26% at 50% 64%,rgba(255,226,150,var(--tg-stage)),rgba(255,220,160,calc(var(--tg-stage)*.4)) 38%,transparent 78%),
      /* Lop 2 — tint am rong: cung tam moi (y 64%), hep 48% -> 40% de
         tint khong tran len buc san khau, mo dan ra xa, het o 70%. */
      radial-gradient(ellipse 60% 40% at 50% 64%,var(--tg-tint),transparent 70%),
      linear-gradient(90deg,rgba(24,4,16,var(--tg-side)) 0%,transparent 16%,transparent 84%,rgba(24,4,16,var(--tg-side)) 100%)}
  /* Ánh sáng dọc thảm đỏ giữa — SỬA sau chẩn đoán 2026-11-05 (xem dưới):
     bản cũ là hình thang clip-path + gradient dọc + screen ở opacity 1
     (mốc 5): khi camera zoom lên sân khấu, mép thẳng của hình thang cắt
     ngang thảm đỏ tối thành 1 mảng sáng dài hình chữ nhật, mép cứng,
     lại tràn ra ngoài thảm thật (thảm chỉ rộng ~13% ở sân khấu trong
     khi tia cũ rộng 20% của #world). Bản mới: KHÔNG còn clip-path,
     chỉ còn 1 quầng sáng bầu dục (radial, tâm ở sân khấu, mờ dần ra
     4 phía) + mask dọc làm mờ dần cả đầu trên lẫn cuối dưới — không
     còn đường thẳng nào. Hẹp hơn (rộng 16%, ôm sát thảm giữa) và đỉnh
     ở mốc cao đã giảm (xem --ab-op: mốc 5 chỉ còn .5 sau V12). */
  /* V12b bo sung (2026-11-06, anh 26): doi tam radial xuong 45% hop
     (the-gioi y ~65%, dau tham) thay vi 28% hop (y ~54%, ngay cau
     thang) — tam cu chong sang len cau thang/buc von sang san, cung
     voi tiergrade + spot tao mang vang phang co canh thang. */
  #aislebeam{position:absolute;left:42%;top:36%;width:16%;height:64%;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 50% 58% at 50% 45%,rgba(255,238,190,.55),rgba(255,214,140,.22) 42%,transparent 82%);
    mix-blend-mode:screen;opacity:var(--ab-op);transition:opacity 2s;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 58%,transparent 88%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 58%,transparent 88%)}
  /* Làm mờ nhẹ 2 dải thảm đỏ bên (hình thang theo phối cảnh nền mac-dinh:
     trái đỉnh x 36–42% → đáy x 26–38%, phải đối xứng). Ở mốc hoàng gia
     (sảnh mới chỉ có 1 thảm giữa) độ mờ giảm gần về 0 để khỏi tối bàn vàng. */
  .sidecarpet{position:absolute;top:38%;height:62%;width:18%;z-index:2;pointer-events:none;
    background:rgba(28,6,18,.2);opacity:var(--sc-op);transition:opacity 2s}
  .sidecarpet.l{left:24%;clip-path:polygon(67% 0,100% 0,78% 100%,11% 100%)}
  .sidecarpet.r{left:58%;clip-path:polygon(0 0,33% 0,89% 100%,22% 100%)}
  /* Tia sáng #beams (main.js bật từ mốc 30) mạnh dần theo mốc; đèn sân
     khấu #spot sáng dần theo mốc. Đặt sau rule gốc nên thắng khi .on. */
  #stage[data-tier="2"] #beams.on{opacity:.55}
  #stage[data-tier="3"] #beams.on{opacity:.7}
  #stage[data-tier="4"] #beams.on{opacity:.6}
  /* V12 (2026-11-06): tier 5 truoc day khong co rule rieng nen roi ve
     #beams.on{opacity:1} (va couple-on cung ep 1) — 3 tia sang mo (blur
     6px, screen) + tia xoay conic chong len nhau thanh mang vang phu ca
     khung tren nen hoang gia von da sang. Gioi han .4 o tier 5: tia van
     doc duoc la anh sang san khau, khong rua trang khung. Rule moc thang
     rule couple-on (specificity cao hon) nen cap len san khau cung chi
     toi .4 o tier 5. */
  #stage[data-tier="5"] #beams.on{opacity:.4}
  #spot{background:radial-gradient(ellipse at 50% 88%,rgba(255,225,150,var(--spot-a)),rgba(255,225,150,.14) 55%,transparent 75%)}
  #banner{position:absolute;left:50%;top:calc(var(--by,30)*1%);transform:translate(-50%,-50%) scale(.8);z-index:2150;pointer-events:none;
    background:linear-gradient(100deg,#a5123f,#d81b60 55%,#a5123f);color:#fff;font-weight:800;letter-spacing:.4px;
    font-size:calc(var(--u0)*3.1);padding:calc(var(--u0)*1.1) calc(var(--u0)*3.4);border-radius:999px;white-space:nowrap;

  /* ---------- Nhân vật ---------- */

  /* V2 (2026-11-05): bong chan that (.gshadow) neo cung o day figwrap

  .person .figwrap svg{height:var(--fh,120px);display:block}

  .person.flip.walking .figwrap{animation:walkBobFlip .34s ease-in-out infinite}
  @keyframes walkBob{50%{transform:translateY(-3.2%)}}
  @keyframes walkBobFlip{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-3.2%)}}
  .person .leg,.person .arm{transform-box:fill-box;transform-origin:50% 6%}
  .person.walking .legL{animation:swing .34s ease-in-out infinite alternate}
  .person.walking .legR{animation:swing .34s ease-in-out infinite alternate-reverse}
  .person.walking .armL{animation:swingArm .34s ease-in-out infinite alternate-reverse}
  .person.walking .armR{animation:swingArm .34s ease-in-out infinite alternate}

  .person.flip.dance .figwrap{animation:danceAF .5s ease-in-out infinite}
  @keyframes danceAF{25%{transform:scaleX(-1) translateY(-5%) rotate(3deg)}75%{transform:scaleX(-1) translateY(-1%) rotate(-3deg)}}
  .person .chip{display:flex;align-items:center;gap:3px;background:rgba(60,8,30,.6);border:1px solid rgba(255,205,225,.5);

  #mc .say b{display:block;font-size:calc(var(--u)*2*var(--f-mc,1));color:#c2185b;margin-bottom:calc(var(--u)*.3)}
