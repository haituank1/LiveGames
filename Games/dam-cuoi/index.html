<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đám Cưới Online</title>
<style>
  :root{--u0:4px;--k:1.2;--u:var(--u0);--safe:0px;--side:0px}
  #left,#side,#mc,#queue{--u:calc(var(--u0)*var(--k))}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a0a18;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#2a0a18}
  /* ---------- Phòng cưới rộng + camera lia ---------- */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#430b18}
  #bgfull{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;z-index:1}
  #people{position:absolute;inset:0;z-index:3}
  #spot{position:absolute;left:50%;top:13%;width:31%;height:27%;transform:translateX(-50%);pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 88%,rgba(255,225,150,.5),rgba(255,225,150,.14) 55%,transparent 75%);
    opacity:0;transition:opacity .8s}
  #spot.on{opacity:1;animation:spotPulse 2.6s ease-in-out infinite}
  @keyframes spotPulse{0%,100%{opacity:.75}50%{opacity:1}}
  .person.pairfx .figwrap{position:relative;filter:drop-shadow(0 0 14px rgba(255,120,180,1)) drop-shadow(0 0 34px rgba(255,190,90,.95)) drop-shadow(0 0 70px rgba(255,160,60,.55))}
  .person.pairfx::before{content:'';position:absolute;left:50%;bottom:-4%;width:150%;aspect-ratio:1;transform:translateX(-50%);
    border-radius:50%;border:3px solid rgba(255,150,200,.85);animation:pairRing 1.15s ease-out infinite;pointer-events:none}
  .person.pairfx .figwrap::after{content:'';position:absolute;left:50%;bottom:-9%;width:150%;aspect-ratio:1;transform:translateX(-50%);
    border-radius:50%;border:3px solid rgba(255,214,110,.9);animation:pairRing 1.15s .57s ease-out infinite;pointer-events:none}
  .person.pairfx::after{content:'';position:absolute;left:50%;top:42%;width:235%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;
    border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(from 0deg,rgba(255,214,100,.55) 0deg 9deg,transparent 9deg 22deg,rgba(255,150,200,.42) 22deg 28deg,transparent 28deg 45deg);
    -webkit-mask-image:radial-gradient(circle,#000 26%,transparent 68%);mask-image:radial-gradient(circle,#000 26%,transparent 68%);
    animation:auraSpin 9s linear infinite}
  @keyframes auraSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes pairRing{from{transform:translateX(-50%) scale(.45);opacity:1}to{transform:translateX(-50%) scale(1.15);opacity:0}}
  .person.far .figwrap{animation-play-state:paused!important}
  .person.far .figwrap img.chibi{animation-play-state:paused!important}
  #beams{position:absolute;inset:-20% -10%;opacity:0;transition:opacity 2s;pointer-events:none;
    background:conic-gradient(from 180deg at 50% -10%,transparent 0deg,rgba(255,230,150,.20) 12deg,transparent 26deg,rgba(255,200,220,.16) 44deg,transparent 60deg,rgba(255,230,150,.20) 84deg,transparent 100deg,rgba(255,200,220,.16) 128deg,transparent 146deg,rgba(255,230,150,.20) 172deg,transparent 190deg,rgba(255,200,220,.16) 214deg,transparent 232deg,rgba(255,230,150,.20) 258deg,transparent 276deg,rgba(255,200,220,.16) 300deg,transparent 318deg,rgba(255,230,150,.2) 342deg,transparent 360deg);
    animation:beams 26s linear infinite}
  #beams.on{opacity:1}
  @keyframes beams{to{transform:rotate(360deg)}}
  #royalglow{position:absolute;inset:0;opacity:0;transition:opacity 2s;pointer-events:none;
    background:radial-gradient(circle at 50% 30%,rgba(255,225,140,.34),rgba(255,190,90,0) 55%)}
  #royalglow.on{opacity:1;animation:pulseGlow 3.2s ease-in-out infinite}
  @keyframes pulseGlow{50%{opacity:.55}}
  #banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);z-index:1700;pointer-events:none;
    background:linear-gradient(100deg,#a5123f,#d81b60 55%,#a5123f);color:#fff;font-weight:800;letter-spacing:.4px;
    font-size:calc(var(--u0)*3.1);padding:calc(var(--u0)*1.1) calc(var(--u0)*3.4);border-radius:999px;white-space:nowrap;
    border:2px solid rgba(255,215,150,.9);box-shadow:0 6px 24px rgba(120,0,40,.55),0 0 18px rgba(255,110,170,.5);
    opacity:0;transition:opacity .35s,transform .35s}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1500}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,215,150,.8),rgba(255,170,80,0) 70%);z-index:1600}
  #flash.on{animation:flash 1.6s ease-out}
  @keyframes flash{10%{opacity:1}100%{opacity:0}}

  /* ---------- Nhân vật ---------- */
  .person{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .person .figwrap{filter:drop-shadow(0 5px 6px rgba(90,10,40,.35));animation:bob 2.8s ease-in-out infinite}
  .person .figwrap svg{height:var(--fh,120px);display:block}
  .person .figwrap img.chibi{height:var(--fh,120px);display:block}
  .person.walking .figwrap img.chibi{animation:chibiSway .3s ease-in-out infinite alternate}
  @keyframes chibiSway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
  .person.flip .figwrap{transform:scaleX(-1);animation:bobFlip 2.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-1.8%)}}
  @keyframes bobFlip{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-1.8%)}}
  .person.walking .figwrap{animation:walkBob .34s ease-in-out infinite}
  .person.flip.walking .figwrap{animation:walkBobFlip .34s ease-in-out infinite}
  @keyframes walkBob{50%{transform:translateY(-3.2%)}}
  @keyframes walkBobFlip{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-3.2%)}}
  .person .leg,.person .arm{transform-box:fill-box;transform-origin:50% 6%}
  .person.walking .legL{animation:swing .34s ease-in-out infinite alternate}
  .person.walking .legR{animation:swing .34s ease-in-out infinite alternate-reverse}
  .person.walking .armL{animation:swingArm .34s ease-in-out infinite alternate-reverse}
  .person.walking .armR{animation:swingArm .34s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}
  @keyframes swingArm{from{transform:rotate(10deg)}to{transform:rotate(-10deg)}}
  .person.dance .figwrap{animation:danceA .5s ease-in-out infinite}
  @keyframes danceA{25%{transform:translateY(-5%) rotate(-3deg)}75%{transform:translateY(-1%) rotate(3deg)}}
  .person.flip.dance .figwrap{animation:danceAF .5s ease-in-out infinite}
  @keyframes danceAF{25%{transform:scaleX(-1) translateY(-5%) rotate(3deg)}75%{transform:scaleX(-1) translateY(-1%) rotate(-3deg)}}
  .person .chip{display:flex;align-items:center;gap:3px;background:rgba(60,8,30,.6);border:1px solid rgba(255,205,225,.5);
    border-radius:999px;padding:1.5px 7px 1.5px 1.5px;color:#fff;font-weight:600;white-space:nowrap;margin-top:1px;
    font-size:calc(var(--fh,120px)*.105);max-width:calc(var(--fh,120px)*1.5);overflow:hidden}
  .person.wedding .chip{border-color:#ffd76a;background:rgba(110,60,0,.72)}
  .person .chip .nm{overflow:hidden;text-overflow:ellipsis}
  .person .bubble{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%) scale(.7);width:max-content;max-width:170px;background:rgba(255,255,255,.96);color:#4a1030;font-size:11px;line-height:1.3;font-weight:600;padding:3px 8px;border-radius:10px;box-shadow:0 3px 10px rgba(90,10,40,.35);text-align:center;pointer-events:none;opacity:0;transition:opacity .22s,transform .22s;z-index:6;word-break:break-word}
  .person .bubble::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(255,255,255,.96);border-bottom:0}
  .person .bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
  .person .chip .av{flex:none;width:calc(var(--fh,120px)*.17);height:calc(var(--fh,120px)*.17);border-radius:50%;overflow:hidden;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--fh,120px)*.1)}
  .person .chip .av img{width:100%;height:100%;object-fit:cover}
  .person .crown{position:absolute;top:calc(var(--fh,120px)*-.16);font-size:calc(var(--fh,120px)*.26);z-index:3;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));animation:bob 2.2s ease-in-out infinite}

  /* ---------- Khung trên ---------- */
  #left{position:absolute;top:calc(var(--safe) + var(--u)*2);left:calc(var(--side) + var(--u)*1);display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.6);max-width:calc(100% - var(--side)*2 - var(--u)*42);z-index:2000;
    background:rgba(46,6,24,.55);border:1px solid rgba(255,190,215,.3);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1) calc(var(--u)*1.6)}
  #rules{display:none}
  #guide{color:#ffd9e8;font-size:calc(var(--u)*2.05);font-weight:700;line-height:1.3;
    text-shadow:0 1px 3px #0009;transition:opacity .35s,transform .35s}
  #guide.out{opacity:0;transform:translateY(calc(var(--u)*-1))}
  #guide:empty{display:none}
  #goal{color:#ffe9b8;font-size:calc(var(--u)*1.8);font-weight:600}
  #goal .bar{height:calc(var(--u)*1);background:rgba(255,255,255,.16);border-radius:999px;margin-top:calc(var(--u)*.45);overflow:hidden}
  #goal .bar i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ff7eb0,#ffc93c);transition:width 1.2s ease}
  #goal .tiername{color:#ffd76a}

  #side{position:absolute;top:calc(var(--safe) + var(--u)*2);right:calc(var(--side) + var(--u)*1);display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*1);z-index:2000}
  #board{background:rgba(60,10,32,.58);color:#ffe3ef;border:1px solid rgba(255,180,210,.38);border-radius:calc(var(--u)*1.6);
    padding:calc(var(--u)*.7) calc(var(--u)*1.5);font-size:calc(var(--u)*1.9);min-width:calc(var(--u)*24)}
  #board h4{margin:0 0 calc(var(--u)*.4);font-size:calc(var(--u)*2.2);color:#ffd9e8}
  #board ol{margin:0;padding-left:calc(var(--u)*3.5)}
  #board li{display:flex;justify-content:space-between;gap:calc(var(--u)*2)}
  #board li span{max-width:calc(var(--u)*19);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #board em{font-style:normal;color:#ffd76a}
  #toasts{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*1);width:calc(var(--u)*35)}
  .toast{position:relative;overflow:hidden;display:flex;align-items:center;gap:calc(var(--u)*1.2);width:100%;box-sizing:border-box;
    background:linear-gradient(100deg,rgba(150,25,90,.92),rgba(220,60,130,.88));border:1px solid rgba(255,190,220,.8);
    color:#fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*.7) calc(var(--u)*1.4);font-size:calc(var(--u)*2.3);
    box-shadow:0 0 calc(var(--u)*1.7) rgba(255,110,180,.6);animation:tin .45s cubic-bezier(.2,.9,.3,1.2);transition:opacity .35s,transform .35s}
  .toast.vip{background:linear-gradient(100deg,rgba(150,85,0,.94),rgba(235,165,25,.9));border-color:rgba(255,235,160,.95)}
  .toast.out{opacity:0;transform:translateX(30px)}
  @keyframes tin{from{opacity:0;transform:translateX(calc(var(--u)*30)) scale(.9)}}

  #queue{position:absolute;left:calc(var(--side) + var(--u)*1);bottom:calc(var(--u)*2);background:rgba(45,6,22,.6);z-index:2000;
    border:1px solid rgba(255,190,215,.35);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*.9) calc(var(--u)*1.6);
    color:#ffe9f2;font-size:calc(var(--u)*2);line-height:1.5;max-width:calc(var(--u)*38)}
  #queue b{color:#ffd76a}
  #queue .qrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #queue:empty{display:none}

  /* ---------- MC ---------- */
  #mc{position:absolute;left:calc(var(--side) + var(--u)*1);top:calc(var(--u)*30);display:flex;flex-direction:row;align-items:flex-start;
    gap:calc(var(--u)*1.2);width:calc(100% - var(--side)*2 - var(--u)*30);z-index:2100;
    opacity:0;transform:translateX(-110%);transition:transform .7s cubic-bezier(.2,.9,.3,1.1),opacity .5s;pointer-events:none}
  #mc.on{opacity:1;transform:none}
  #mc .pic{flex:none;width:calc(var(--u)*10);height:calc(var(--u)*12);filter:drop-shadow(0 4px 10px #000a)}
  #mc .pic img{width:100%;height:100%;object-fit:contain;object-position:bottom}
  #mc .say{flex:1;position:relative;background:rgba(255,248,238,.97);color:#571233;border:2px solid #e75480;border-radius:calc(var(--u)*2.4);
    padding:calc(var(--u)*1) calc(var(--u)*1.8);font-size:calc(var(--u)*2.5);font-weight:600;line-height:1.3;box-shadow:0 4px 14px #0007}
  #mc .say b{display:block;font-size:calc(var(--u)*2);color:#c2185b;margin-bottom:calc(var(--u)*.3)}
  #mc .say::before{content:'';position:absolute;left:calc(var(--u)*-2.2);top:calc(var(--u)*3.4);border:calc(var(--u)*1) solid transparent;border-right:calc(var(--u)*1.2) solid #e75480}

  #status{position:absolute;top:calc(var(--u0)*.6);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u0)*2.2);color:#fff;z-index:2200;
    background:rgba(0,0,0,.5);padding:calc(var(--u0)*.4) calc(var(--u0)*1.6);border-radius:999px;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  #status.err{background:rgba(140,20,20,.85)} #status.demo{background:rgba(150,30,90,.85)}
  #status.ok{display:none!important}
  #sound{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*2);font:inherit;font-size:calc(var(--u)*2.6);color:#fff;cursor:pointer;z-index:2200;
    background:rgba(170,30,90,.88);border:1px solid rgba(255,210,230,.6);border-radius:999px;padding:calc(var(--u)*1) calc(var(--u)*2.4);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bgfull"></div>
    <div id="spot"></div>
    <div id="people"></div>
  </div>
  <div id="beams"></div>
  <div id="royalglow"></div>
  <canvas id="fx"></canvas>
  <div id="banner"></div>
  <div id="flash"></div>
  <div id="status"></div>
  <div id="left">
    <div id="rules"></div>
    <div id="guide"></div>
    <div id="goal" style="display:none"><span id="goaltext"></span><div class="bar"><i id="goalbar"></i></div></div>
  </div>
  <div id="side">
    <div id="board" style="display:none"><h4>💞 Cặp đôi được yêu thích</h4><ol></ol></div>
    <div id="toasts"></div>
  </div>
  <div id="queue"></div>
  <div id="mc">
    <div class="pic">
      <img src="img/mc.png" alt="MC">
    </div>
    <div class="say"><b>MC</b><span></span></div>
  </div>
  <button id="sound" style="display:none">🔈 Bấm để bật âm thanh</button>
</div>

<script src="../../LiveBridge/public/livebridge-client.js"></script>
<script src="../../LiveBridge/public/npc-voice.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/people.js"></script>
<script src="js/main.js"></script>
</body>
</html>
