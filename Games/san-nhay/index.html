<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sàn Nhảy Quẩy Max</title>
<style>
  :root{--u0:4px;--k:1.2;--u:var(--u0);--safe:0px;--side:0px}
  #left,#side,#au,#goldboard,#guide{--u:calc(var(--u0)*var(--k))}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0618;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#150a2e}
  /* Nền minh họa theo cảnh: sân khấu trên ~45%, sàn nhảy dưới */
  #scene{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
  #stage[data-venue="neon"] #scene{background-image:url('bg.webp'),linear-gradient(180deg,#1d0b42,#241055)}
  #stage[data-venue="beach"] #scene{background-image:url('bg-beach.webp'),linear-gradient(180deg,#57b8f0,#a06a35)}
  #stage[data-venue="snow"] #scene{background-image:url('bg-snow.webp'),linear-gradient(180deg,#274a86,#b9cfe8)}
  /* lưới sàn phát sáng phủ lên phần sàn, nhịp theo beat khi Party Max */
  #floorgrid{position:absolute;left:-10%;right:-10%;top:58%;bottom:0;opacity:.28;pointer-events:none;transition:filter .12s;
    background:linear-gradient(90deg,rgba(255,46,170,.35) 2px,transparent 2px) 0 0/12.5% 100%,
               linear-gradient(180deg,rgba(70,200,255,.30) 2px,transparent 2px) 0 0/100% 14%;
    transform:perspective(300px) rotateX(38deg);transform-origin:top}
  #stage.partymax #floorgrid{opacity:.55;animation:floorPulse .5s ease-in-out infinite alternate}
  #stage.beat #floorgrid{filter:brightness(2)}
  #stage.beat #podium{filter:brightness(1.35)}
  @keyframes floorPulse{to{filter:brightness(1.7)}}
  #beams{position:absolute;inset:-20% -10%;opacity:0;transition:opacity 1.2s;pointer-events:none;
    background:conic-gradient(from 180deg at 50% -10%,transparent 0deg,rgba(255,80,200,.20) 12deg,transparent 26deg,rgba(80,200,255,.18) 44deg,transparent 60deg,rgba(255,230,120,.2) 84deg,transparent 100deg,rgba(255,80,200,.18) 128deg,transparent 146deg,rgba(80,200,255,.2) 172deg,transparent 190deg,rgba(255,230,120,.18) 214deg,transparent 232deg,rgba(255,80,200,.2) 258deg,transparent 276deg,rgba(80,200,255,.18) 300deg,transparent 318deg,rgba(255,230,120,.2) 342deg,transparent 360deg);
    animation:beams 18s linear infinite}
  #beams.on{opacity:1}
  @keyframes beams{to{transform:rotate(360deg)}}
  /* hào quang mặt sân khấu (nơi top 3 đứng) + bục solo trước sân khấu */
  #stageglow{position:absolute;left:50%;top:43.5%;transform:translate(-50%,-50%);width:94%;height:6%;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,230,160,.38),rgba(255,120,220,.14) 55%,transparent 75%)}
  #podium{position:absolute;left:50%;top:58.5%;transform:translate(-50%,-50%);width:36%;height:calc(var(--u0)*4.6);pointer-events:none;transition:filter .12s;
    border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#ffe9ff,#c86bff 55%,#5e2a9e 100%);
    box-shadow:0 0 26px rgba(230,130,255,.9),0 0 60px rgba(160,60,255,.45)}
  #podium::after{content:'BỤC SOLO';position:absolute;left:50%;top:112%;transform:translateX(-50%);white-space:nowrap;
    font-size:calc(var(--u0)*1.8);font-weight:800;letter-spacing:2.5px;color:#ffd9fb;text-shadow:0 0 8px #ff2eaa,0 1px 3px #000}
  #pairspot{position:absolute;left:50%;top:73.5%;transform:translate(-50%,-50%);width:52%;height:calc(var(--u0)*5);pointer-events:none;
    border-radius:50%;opacity:0;transition:opacity .5s;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,190,230,.85),rgba(255,80,180,.35) 60%,transparent 78%);
    box-shadow:0 0 34px rgba(255,110,200,.55)}
  #pairspot.on{opacity:1}
  #people{position:absolute;inset:0}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1500}
  /* Trực thăng VIP bay ngang trên sân khấu */
  #heli{position:absolute;top:19.5%;left:110%;width:47%;z-index:1550;pointer-events:none;opacity:0;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
  #heli.fly{opacity:1;animation:heliFly 6.5s ease-in-out forwards}
  @keyframes heliFly{
    0%{left:108%;transform:translateX(0) translateY(0)}
    32%{left:50%;transform:translateX(-50%) translateY(0)}
    45%{left:50%;transform:translateX(-50%) translateY(2.2%)}
    58%{left:50%;transform:translateX(-50%) translateY(0)}
    100%{left:-58%;transform:translateX(0) translateY(-1%)}}
  #banner{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);z-index:1700;pointer-events:none;
    background:linear-gradient(100deg,#6a1bb0,#d81bb0 55%,#6a1bb0);color:#fff;font-weight:800;letter-spacing:.4px;text-align:center;
    font-size:calc(var(--u0)*3);padding:calc(var(--u0)*1.1) calc(var(--u0)*3.2);border-radius:999px;max-width:88%;
    border:2px solid rgba(255,220,150,.9);box-shadow:0 6px 24px rgba(40,0,80,.55),0 0 18px rgba(255,80,220,.5);
    opacity:0;transition:opacity .35s,transform .35s}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  /* Chữ lớn toàn màn hình khi Party Max */
  #bigtext{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1680;pointer-events:none;text-align:center;
    font-size:calc(var(--u0)*8.6);font-weight:900;letter-spacing:1px;line-height:1.12;color:#ffe14d;opacity:0;white-space:nowrap;
    text-shadow:0 0 8px #ff9d2e,0 0 26px #ff2eaa,0 4px 6px rgba(0,0,0,.6)}
  #bigtext.on{animation:bigZoom 2.8s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes bigZoom{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
  #judge{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);z-index:1650;pointer-events:none;
    font-size:calc(var(--u0)*5.2);font-weight:900;letter-spacing:1px;opacity:0;color:#fff}
  #judge.pop{animation:judgePop .8s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  #judge.perfect{color:#ffd76a;text-shadow:0 0 14px #ffb52e,0 2px 4px #000a}
  #judge.great{color:#7ed6ff;text-shadow:0 0 14px #2e9bff,0 2px 4px #000a}
  #judge.cool{color:#b8f26d;text-shadow:0 0 12px #5cb82e,0 2px 4px #000a}
  #judge.bad{color:#ffb35c;text-shadow:0 0 12px #e07b2e,0 2px 4px #000a}
  #judge.miss{color:#ff8fa5;text-shadow:0 0 12px #e03550,0 2px 4px #000a}

  /* ---------- Dancer ---------- */
  .dancer{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform;transition:transform .9s ease}
  .dancer .figwrap{filter:drop-shadow(0 5px 6px rgba(10,0,30,.45))}
  .dancer .figwrap img.chibi{height:var(--fh,120px);display:block}
  .dancer.onpodium .figwrap{filter:drop-shadow(0 0 14px rgba(255,215,106,.95)) drop-shadow(0 6px 8px rgba(10,0,30,.4))}
  .dancer.onstage .figwrap{filter:drop-shadow(0 0 12px rgba(255,215,106,.8)) drop-shadow(0 5px 7px rgba(10,0,30,.4))}
  .dancer.paired .figwrap{filter:drop-shadow(0 0 13px rgba(255,110,200,.95)) drop-shadow(0 5px 7px rgba(10,0,30,.4))}
  /* 6 điệu nhảy theo lớp */
  .d-dai-gia .figwrap{animation:dgSway 1.7s ease-in-out infinite}
  @keyframes dgSway{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-2.2%) rotate(1.4deg)}}
  .d-idol .figwrap{animation:idolWave .8s ease-in-out infinite}
  @keyframes idolWave{0%,100%{transform:translateY(0) rotate(-3.6deg)}50%{transform:translateY(-4.5%) rotate(3.6deg)}}
  .d-dj .figwrap{animation:djBounce .52s ease-in-out infinite}
  @keyframes djBounce{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-7%) scaleY(1.02)}}
  .d-quay-hai .figwrap{animation:hipShake .62s ease-in-out infinite}
  @keyframes hipShake{0%,100%{transform:translateX(-3.4%) rotate(-3deg)}50%{transform:translateX(3.4%) rotate(3deg)}}
  .d-mascot .figwrap{animation:mascotWiggle 1.5s ease-in-out infinite}
  @keyframes mascotWiggle{0%,100%{transform:translateY(0) rotate(-2.6deg)}50%{transform:translateY(-1.4%) rotate(2.6deg)}}
  .d-tan-binh .figwrap{animation:tanHop .7s ease-in-out infinite}
  @keyframes tanHop{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5.5%) rotate(1.6deg)}}
  #stage.partymax .dancer .figwrap{animation-duration:.38s!important}
  #stage.partymax .dancer{filter:brightness(1.12)}
  .dancer .chip{display:flex;align-items:center;gap:2px;background:rgba(16,4,38,.62);border:1px solid rgba(215,170,255,.5);
    border-radius:999px;padding:1px 5px 1px 1px;color:#fff;font-weight:600;white-space:nowrap;margin-top:0;
    font-size:calc(var(--fh,120px)*.098);max-width:calc(var(--fh,120px)*1.45);overflow:hidden}
  .dancer.leader .chip{border-color:#ffd76a;background:rgba(110,60,0,.75)}
  .dancer .chip .nm{overflow:hidden;text-overflow:ellipsis}
  .dancer .chip .av{flex:none;width:calc(var(--fh,120px)*.16);height:calc(var(--fh,120px)*.16);border-radius:50%;overflow:hidden;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--fh,120px)*.095)}
  .dancer .chip .av img{width:100%;height:100%;object-fit:cover}
  .dancer.onpodium .chip,.dancer.onstage .chip,.dancer.paired .chip{font-size:calc(var(--u0)*2.6);max-width:calc(var(--u0)*36)}
  .dancer.onpodium .chip .av,.dancer.onstage .chip .av,.dancer.paired .chip .av{width:calc(var(--u0)*4);height:calc(var(--u0)*4);font-size:calc(var(--u0)*2.3)}
  .dancer.onpodium .bubble,.dancer.onstage .bubble,.dancer.paired .bubble{font-size:calc(var(--u0)*2.6);max-width:calc(var(--u0)*38)}
  .dancer .crown{position:absolute;top:calc(var(--fh,120px)*-.15);font-size:calc(var(--fh,120px)*.27);z-index:3;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));animation:crownBob 2.2s ease-in-out infinite}
  .dancer .pairheart{position:absolute;top:calc(var(--fh,120px)*-.16);font-size:calc(var(--fh,120px)*.24);z-index:3;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));animation:crownBob 1.4s ease-in-out infinite}
  @keyframes crownBob{50%{transform:translateY(-6%)}}
  .dancer .bubble{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%) scale(.7);z-index:5;
    background:rgba(255,255,255,.96);color:#38124f;border-radius:12px;padding:3px 8px;font-weight:600;text-align:center;
    font-size:calc(var(--fh,120px)*.1);line-height:1.25;width:max-content;max-width:calc(var(--fh,120px)*1.9);
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .dancer .bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
  .dancer .halo{position:absolute;top:calc(var(--fh,120px)*-.13);left:50%;transform:translateX(-50%);z-index:2;
    width:calc(var(--fh,120px)*.52);height:calc(var(--fh,120px)*.13);border-radius:50%;
    border:calc(var(--fh,120px)*.045) solid #ffd76a;box-shadow:0 0 12px #ffd76a, inset 0 0 8px #ffd76a;
    opacity:0;transition:opacity .4s}
  .dancer .wing{position:absolute;top:calc(var(--fh,120px)*.16);z-index:-1;width:calc(var(--fh,120px)*.5);height:calc(var(--fh,120px)*.62);
    background:radial-gradient(ellipse at 50% 20%,#ffffff,#cfe6ff 60%,rgba(160,200,255,.25));
    opacity:0;transition:opacity .4s}
  .dancer .wingL{right:calc(100% - var(--fh,120px)*.22);border-radius:90% 8% 70% 20%;transform-origin:100% 20%}
  .dancer .wingR{left:calc(100% - var(--fh,120px)*.22);border-radius:8% 90% 20% 70%;transform-origin:0 20%}
  .dancer.grand .halo{opacity:1;animation:crownBob 1.6s ease-in-out infinite}
  .dancer.grand .wing{opacity:.95}
  .dancer.grand .wingL{animation:flapL .7s ease-in-out infinite alternate}
  .dancer.grand .wingR{animation:flapR .7s ease-in-out infinite alternate}
  @keyframes flapL{to{transform:rotate(-17deg)}}
  @keyframes flapR{to{transform:rotate(17deg)}}

  /* ---------- Bảng vàng tuần (thanh vàng trên cùng) ---------- */
  #goldboard{position:absolute;top:calc(var(--safe) + var(--u)*4.2);left:calc(var(--side) + var(--u)*1);right:calc(var(--side) + var(--u)*1);z-index:2100;
    background:linear-gradient(180deg,#8a5a00,#c9971f 30%,#a87b12 70%,#7c5200);
    border:2px solid #ffe9a8;border-radius:calc(var(--u)*1.8);color:#fff8dc;
    box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 1px 0 #fff8,inset 0 -8px 18px rgba(90,50,0,.45);
    padding:calc(var(--u)*.55) calc(var(--u)*1.2) calc(var(--u)*.7)}
  #goldboard .gb-head{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*2);
    font-size:calc(var(--u)*2.3);font-weight:900;letter-spacing:.6px;color:#ffedb5;text-shadow:0 1px 3px rgba(80,40,0,.8)}
  #goldboard .gb-reset{font-size:calc(var(--u)*1.65);font-weight:600;color:#ffe1a0;white-space:nowrap}
  #goldboard .gb-slots{display:flex;gap:calc(var(--u)*1);margin-top:calc(var(--u)*.5)}
  .gbslot{flex:1;display:flex;align-items:center;gap:calc(var(--u)*.8);min-width:0;
    background:linear-gradient(180deg,rgba(255,244,200,.28),rgba(120,70,0,.35));
    border:1px solid rgba(255,233,168,.85);border-radius:calc(var(--u)*1.3);padding:calc(var(--u)*.45) calc(var(--u)*.8)}
  .gbslot.first{background:linear-gradient(180deg,rgba(255,250,215,.5),rgba(150,95,0,.4));border-color:#fff3b0}
  .gbslot img.gb-av{height:calc(var(--u)*8);width:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .gbslot .gb-ph{height:calc(var(--u)*8);width:calc(var(--u)*6);flex:none;display:grid;place-items:center;font-size:calc(var(--u)*3.4);color:#ffe9a8}
  .gbslot .gb-info{min-width:0;line-height:1.22}
  .gbslot .gb-ttl{font-size:calc(var(--u)*1.8);font-weight:800;color:#ffe9a8;white-space:nowrap}
  .gbslot .gb-name{font-size:calc(var(--u)*2.05);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--u)*18.5)}
  .gbslot .gb-dia{font-size:calc(var(--u)*1.85);font-weight:700;color:#ffe14d;white-space:nowrap}
  #goldboard .gb-rest{font-size:calc(var(--u)*1.6);color:#ffedb5;margin-top:calc(var(--u)*.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #goldboard .gb-rest:empty{display:none}

  /* ---------- Cụm trái / phải dưới bảng vàng ---------- */
  #left{position:absolute;top:calc(var(--safe) + var(--u)*25.6);left:calc(var(--side) + var(--u)*1);display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.9);z-index:2000;max-width:calc(var(--u)*40)}
  #energy{background:rgba(20,6,44,.66);border:1px solid rgba(255,150,230,.55);border-radius:calc(var(--u)*1.5);
    padding:calc(var(--u)*.7) calc(var(--u)*1.4);color:#ffe3fb;font-size:calc(var(--u)*1.95);font-weight:700;min-width:calc(var(--u)*33)}
  #energy .bar{height:calc(var(--u)*1.25);background:rgba(255,255,255,.16);border-radius:999px;margin-top:calc(var(--u)*.5);overflow:hidden}
  #energy .bar i{display:block;height:100%;width:10%;border-radius:999px;background:linear-gradient(90deg,#ff2eaa,#ffc93c);transition:width .8s ease}
  #energy b{color:#ffc93c}
  #venue{color:#e9d8ff;font-size:calc(var(--u)*1.85);font-weight:600;background:rgba(20,6,44,.55);
    border:1px solid rgba(190,160,255,.4);border-radius:999px;padding:calc(var(--u)*.45) calc(var(--u)*1.3)}
  #side{position:absolute;top:calc(var(--safe) + var(--u)*25.6);right:calc(var(--side) + var(--u)*1);display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*.9);z-index:2000}
  #toasts{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*.9);width:calc(var(--u)*34)}
  .toast{position:relative;overflow:hidden;width:100%;box-sizing:border-box;
    background:linear-gradient(100deg,rgba(90,25,150,.92),rgba(190,40,160,.88));border:1px solid rgba(230,190,255,.8);
    color:#fff;border-radius:calc(var(--u)*2.6);padding:calc(var(--u)*.65) calc(var(--u)*1.3);font-size:calc(var(--u)*2.05);
    box-shadow:0 0 calc(var(--u)*1.6) rgba(230,80,255,.55);animation:tin .45s cubic-bezier(.2,.9,.3,1.2);transition:opacity .35s,transform .35s}
  .toast.vip{background:linear-gradient(100deg,rgba(150,85,0,.94),rgba(235,165,25,.9));border-color:rgba(255,235,160,.95)}
  .toast.out{opacity:0;transform:translateX(30px)}
  @keyframes tin{from{opacity:0;transform:translateX(calc(var(--u)*30)) scale(.9)}}

  /* ---------- Bảng chấm điểm AU (dọc, bên phải) ---------- */
  #tally{position:absolute;right:calc(var(--side) + var(--u)*1);top:47%;z-index:2000;min-width:calc(var(--u)*21);
    background:rgba(16,4,36,.72);border:1px solid rgba(255,150,230,.5);border-radius:calc(var(--u)*1.5);
    padding:calc(var(--u)*.7) calc(var(--u)*1.1);color:#fff;font-size:calc(var(--u)*1.8)}
  #tally h5{margin:0 0 calc(var(--u)*.4);font-size:calc(var(--u)*1.8);color:#ffd9fb;text-align:center}
  #tally .trow{display:flex;justify-content:space-between;gap:calc(var(--u)*1.4);line-height:1.5;font-weight:700}
  #tally .trow b{font-variant-numeric:tabular-nums}
  #tally .perfect{color:#ffd76a} #tally .great{color:#7ed6ff} #tally .cool{color:#b8f26d}
  #tally .bad{color:#ffb35c} #tally .miss{color:#ff8fa5}

  /* ---------- Hướng dẫn 1 dòng (góc trái dưới, trên thanh AU) ---------- */
  #guide{position:absolute;left:calc(var(--side) + var(--u)*1);bottom:calc(var(--u)*14.6);z-index:2000;max-width:62%;
    background:linear-gradient(100deg,rgba(90,20,160,.92),rgba(200,30,160,.9));color:#fff;border:1px solid rgba(230,190,255,.85);
    border-radius:999px;padding:calc(var(--u)*.55) calc(var(--u)*1.5);font-size:calc(var(--u)*1.95);font-weight:700;line-height:1.25;
    text-shadow:0 1px 3px #0009;transition:opacity .35s,transform .35s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #guide.out{opacity:0;transform:translateY(calc(var(--u)*-1))}
  #guide:empty{display:none}

  /* ---------- Thanh AU solo (dưới cùng) ---------- */
  #au{position:absolute;left:calc(var(--side) + var(--u)*1);right:calc(var(--side) + var(--u)*1);bottom:calc(var(--u)*1.2);z-index:2000;
    background:rgba(16,4,36,.8);border:1px solid rgba(255,150,230,.55);border-radius:calc(var(--u)*1.8);
    padding:calc(var(--u)*.8) calc(var(--u)*1.5);color:#fff}
  #au .row1{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*2);font-size:calc(var(--u)*2.25);font-weight:700}
  #au .row1 .who{color:#ffd9fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #au .row1 .combo{color:#ffc93c;white-space:nowrap}
  #au .steps{display:flex;gap:calc(var(--u)*.65);margin-top:calc(var(--u)*.7);justify-content:center}
  #au .step{flex:none;width:calc(var(--u)*4.3);height:calc(var(--u)*4.3);display:grid;place-items:center;border-radius:calc(var(--u)*.9);
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);font-size:calc(var(--u)*2.7);font-weight:800;color:#d9c8ff}
  #au .step.cur{background:#ff2eaa;border-color:#ffd76a;color:#fff;transform:scale(1.22);box-shadow:0 0 12px #ff2eaa}
  #au .step.ok{background:rgba(255,215,106,.85);color:#4a2c00;border-color:#ffd76a}
  #au .step.missed{background:rgba(224,53,80,.55);color:#ffd7de;border-color:#e03550}
  #status{position:absolute;top:calc(var(--u0)*.6);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u0)*2.2);color:#fff;z-index:2200;
    background:rgba(0,0,0,.5);padding:calc(var(--u0)*.4) calc(var(--u0)*1.6);border-radius:999px;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  #status.err{background:rgba(140,20,20,.85)} #status.demo{background:rgba(120,30,160,.85)}
  #status.ok{display:none!important}
  #sound{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*16);font:inherit;font-size:calc(var(--u)*2.4);color:#fff;cursor:pointer;z-index:2200;
    background:rgba(140,30,160,.9);border:1px solid rgba(230,190,255,.6);border-radius:999px;padding:calc(var(--u)*.9) calc(var(--u)*2.2);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
