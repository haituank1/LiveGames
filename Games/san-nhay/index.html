<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sàn Nhảy Quẩy Max</title>
<link rel="icon" href="data:,">
<style>
  :root{--u0:4px;--k:1.2;--u:var(--u0);--safe:0px;--side:0px}
  #left,#side,#au,#goldboard,#guide,#camtab{--u:calc(var(--u0)*var(--k))}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0618;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;
    background:radial-gradient(130% 95% at 50% 38%,#2a1160,#150a2e 55%,#07030f)}

  /* ================= THẾ GIỚI = 1 PHÒNG BAR DUY NHẤT (bg-bar.webp) =================
     #world đúng tỉ lệ ảnh 0.5 (1080×2160); camera lia bằng transform (js/main.js — Cam, lò xo giảm chấn).
     Trong #world CHỈ có: ảnh phòng + màn LED DOM + dancer + hiệu ứng. Không cảnh CSS nào khác. */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #scene{position:absolute;inset:0;background:url('bg-bar.webp') center/100% 100% no-repeat #12082e}
  /* quầng sáng trên bục podium vẽ sẵn (50%, 56.5% — BAR-LAYOUT) */
  #bstage{position:absolute;left:50%;top:56.5%;transform:translate(-50%,-50%);width:46%;height:5%;z-index:2;pointer-events:none;transition:filter .12s;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,190,120,.34),rgba(255,110,60,.12) 55%,transparent 75%)}
  #stage.beat #bstage{filter:brightness(1.6)}
  /* chùm đèn quét — LUÔN quét nhẹ + tự đổi màu (hue) cho sàn lúc nào cũng sống; khoảnh khắc lớn thì rực hẳn */
  #beams{position:absolute;inset:-18% -6%;z-index:6;opacity:.34;transition:opacity 1.2s;pointer-events:none;
    background:conic-gradient(from 180deg at 50% -10%,transparent 0deg,rgba(255,80,200,.20) 12deg,transparent 26deg,rgba(80,200,255,.18) 44deg,transparent 60deg,rgba(255,230,120,.2) 84deg,transparent 100deg,rgba(255,80,200,.18) 128deg,transparent 146deg,rgba(80,200,255,.2) 172deg,transparent 190deg,rgba(255,230,120,.18) 214deg,transparent 232deg,rgba(255,80,200,.2) 258deg,transparent 276deg,rgba(80,200,255,.18) 300deg,transparent 318deg,rgba(255,230,120,.2) 342deg,transparent 360deg);
    animation:beams 18s linear infinite,beamsHue 26s linear infinite}
  #beams.on{opacity:1}
  @keyframes beams{to{transform:rotate(360deg)}}
  @keyframes beamsHue{to{filter:hue-rotate(360deg)}}
  /* quầng sáng sàn đổi màu luân phiên (phủ cả khung hình, blend screen) — sàn "thở" theo nhạc */
  #floorglow{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.5;transition:filter .12s;
    background:radial-gradient(ellipse 90% 42% at 50% 88%,rgba(255,90,180,.20),transparent 65%),radial-gradient(ellipse 70% 34% at 22% 96%,rgba(70,190,255,.16),transparent 65%),radial-gradient(ellipse 70% 34% at 78% 96%,rgba(255,200,80,.15),transparent 65%);
    animation:floorHue 19s linear infinite}
  #stage.beat #floorglow{filter:brightness(1.55)}
  @keyframes floorHue{to{filter:hue-rotate(360deg)}}
  /* viền sáng 4 cạnh chớp màu khi đạt mốc combo solo */
  #edgeglow{position:absolute;inset:0;z-index:1640;pointer-events:none;opacity:0}
  #edgeglow.pop{animation:edgeFlash .75s ease-out}
  @keyframes edgeFlash{0%{opacity:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 42px 10px rgba(255,120,220,.55)}35%{opacity:1}100%{opacity:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,0),inset 0 0 60px 18px rgba(120,200,255,.35)}}
  /* chùm đèn bám theo dancer ĐANG RƠI */
  #fallcone{position:absolute;width:17%;height:46%;z-index:8;pointer-events:none;opacity:0;transition:opacity .35s;
    transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);mix-blend-mode:screen;
    background:linear-gradient(180deg,rgba(255,240,190,.7),rgba(255,240,190,.05) 85%)}
  #fallcone.on{opacity:.55}
  /* vệt bóng ma khi rơi */
  #trails{position:absolute;inset:0;z-index:9;pointer-events:none}
  #trails .ghost{position:absolute;left:0;top:0;opacity:.34;filter:brightness(1.7) saturate(1.4);transition:opacity .45s ease-out}
  #trails .ghost.out{opacity:0}
  /* điểm sáng nhảy đôi */
  #pairglow{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);width:26%;height:calc(var(--u0)*5.2);z-index:7;pointer-events:none;
    border-radius:50%;opacity:0;transition:opacity .5s;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,190,230,.85),rgba(255,80,180,.35) 60%,transparent 78%);
    box-shadow:0 0 34px rgba(255,110,200,.55)}
  #pairglow.on{opacity:1}
  #people{position:absolute;inset:0;z-index:10}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1500}
  /* Trực thăng VIP bay ngang phía trên phòng */
  #heli{position:absolute;top:5%;left:106%;width:23%;z-index:1550;pointer-events:none;opacity:0;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
  #heli.fly{opacity:1;animation:heliFly 6.5s ease-in-out forwards}
  @keyframes heliFly{
    0%{left:104%;transform:translateY(0)}
    32%{left:38.5%;transform:translateY(0)}
    45%{left:38.5%;transform:translateY(4%)}
    58%{left:38.5%;transform:translateY(0)}
    100%{left:-32%;transform:translateY(-2%)}}

  /* ---------- Màn LED DOM — phủ ĐÚNG khung màn vẽ sẵn (BAR-LAYOUT: 19.2/19.4/61.6/11.2) ---------- */
  #screen{position:absolute;left:19.2%;top:19.4%;width:61.6%;height:11.2%;z-index:4;overflow:hidden;border-radius:6px;
    background:radial-gradient(130% 130% at 50% 0%,#2c1160,#0d0522 72%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.65),inset 0 0 34px rgba(120,60,255,.35),0 0 22px rgba(90,140,255,.35)}
  /* DJ CAM: lớp trong của màn — "zoom punch" theo phách 116 BPM (0.5172s/phách) */
  #screenInner{position:absolute;inset:0;z-index:1;transform-origin:50% 62%;animation:djPunch .5172s ease-out infinite}
  @keyframes djPunch{0%{transform:scale(1.05)}22%{transform:scale(1.012)}100%{transform:scale(1)}}
  #screen.hype #screenInner{animation-name:djPunchBig}
  @keyframes djPunchBig{0%{transform:scale(1.09)}22%{transform:scale(1.02)}100%{transform:scale(1)}}
  #screen .eq{position:absolute;left:2%;bottom:15%;display:flex;align-items:flex-end;gap:1.4%;height:64%;width:60%}
  #screen .eq i{flex:1;background:linear-gradient(180deg,#ff2eaa,#39b9ff);border-radius:2px;animation:eqB 1.0344s ease-in-out infinite alternate;min-height:10%}
  #screen .eq i:nth-child(2n){animation-duration:.5172s}
  #screen .eq i:nth-child(3n){animation-duration:1.5516s;animation-delay:-.4s}
  #screen .eq i:nth-child(4n){animation-duration:.7758s;animation-delay:-.2s}
  #screen .eq i:nth-child(5n){animation-duration:1.293s;animation-delay:-.7s}
  #screen .eq i:nth-child(7n){animation-duration:.5172s;animation-delay:-.31s}
  @keyframes eqB{from{height:12%}to{height:97%}}
  /* 2 chùm đèn quét qua lại bên trong màn */
  #screen .beam{position:absolute;top:-38%;width:30%;height:185%;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.55;transform-origin:50% 0}
  #screen .beam.b1{left:9%;background:linear-gradient(90deg,transparent,rgba(70,190,255,.55),transparent);animation:beamSw1 5.17s ease-in-out infinite alternate}
  #screen .beam.b2{right:9%;background:linear-gradient(90deg,transparent,rgba(255,46,170,.55),transparent);animation:beamSw2 6.21s ease-in-out infinite alternate}
  @keyframes beamSw1{from{transform:rotate(-17deg)}to{transform:rotate(15deg)}}
  @keyframes beamSw2{from{transform:rotate(16deg)}to{transform:rotate(-15deg)}}
  /* DJ lớn đứng sau quầy — 2 lớp img chồng nhau để crossfade khi đổi động tác */
  #screenDJwrap{position:absolute;right:3%;bottom:10.5%;height:99%;aspect-ratio:1;z-index:2}
  #screenDJwrap .djimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateX(7%);
    transition:opacity .45s ease,transform .45s ease;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  #screenDJwrap .djimg.on{opacity:1;transform:translateX(0)}
  /* Hiệu ứng ĐỔI DJ: DJ mới nảy vào lấp lánh (.pre = đặt sẵn ngoài khung, .pop = nảy vào), DJ cũ trượt ra (.out) */
  #screenDJwrap .djimg.pre{transition:none;transform:translateX(24%) scale(.66);opacity:0}
  #screenDJwrap .djimg.pop{transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.5,.35,1);filter:brightness(1.3) drop-shadow(0 0 14px rgba(255,255,255,.75))}
  #screenDJwrap .djimg.out{transform:translateX(-22%) scale(.9);opacity:0}
  /* Lớp hiệu ứng đổi DJ phủ trong màn: chớp sáng quét + tia laser tỏa + bảng tên */
  #screenSwapFx{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;--swapCol:#ff5ce1}
  #screenSwapFx.on{opacity:1}
  #screenSwapFx .flash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;
    background:linear-gradient(100deg,transparent 18%,rgba(255,255,255,.95) 48%,var(--swapCol) 62%,transparent 86%);transform:translateX(-115%)}
  #screenSwapFx.on .flash{animation:swapFlash .9s ease-out forwards}
  @keyframes swapFlash{0%{transform:translateX(-115%);opacity:0}16%{opacity:1}55%{transform:translateX(0);opacity:.95}100%{transform:translateX(115%);opacity:0}}
  #screenSwapFx .burst{position:absolute;inset:-32%;mix-blend-mode:screen;opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 50%,var(--swapCol) 0 5deg,transparent 5deg 17deg)}
  #screenSwapFx.on .burst{animation:swapBurst .9s ease-out forwards}
  @keyframes swapBurst{0%{opacity:0;transform:scale(.55) rotate(0deg)}25%{opacity:.55}100%{opacity:0;transform:scale(1.18) rotate(26deg)}}
  #swapTag{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.55);opacity:0;text-align:center;
    background:rgba(8,2,24,.92);border:2px solid var(--swapCol);border-radius:999px;padding:1px 14px 3px;
    box-shadow:0 0 18px var(--swapCol),0 4px 10px rgba(0,0,0,.6)}
  #screenSwapFx.on #swapTag{animation:swapTagA .9s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes swapTagA{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
    38%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
  #swapTag .st1{font-weight:900;font-size:calc(var(--u0)*2.4);letter-spacing:.6px;color:#fff}
  #swapTag .st2{font-weight:900;font-size:calc(var(--u0)*3.3);color:var(--swapCol);text-shadow:0 0 8px var(--swapCol);line-height:1.05}
  /* rung/glitch nhẹ của cả nội dung màn trong lúc đổi DJ (thay nhịp zoom punch ~0.9s) */
  #screenInner.glitching{animation:djGlitch .45s steps(2,end) 2}
  @keyframes djGlitch{0%{transform:translate(0) scale(1.03)}25%{transform:translate(-4px,1px) scale(1.05)}
    50%{transform:translate(3px,-1px) scale(1.02)}75%{transform:translate(-2px,0) scale(1.06)}100%{transform:translate(0) scale(1)}}
  /* bóng quầy DJ ở mép dưới màn — DJ đứng sau quầy */
  #screenBooth{position:absolute;right:0.5%;bottom:12.5%;width:38%;height:19%;z-index:3;
    background:linear-gradient(180deg,#2a1250,#070313 80%);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);
    border-top:2px solid rgba(255,120,230,.6)}
  #screenBooth::before,#screenBooth::after{content:'';position:absolute;top:24%;width:6%;aspect-ratio:1;border-radius:50%;
    background:#54f0ff;box-shadow:0 0 8px #54f0ff;animation:pulse 1.0344s infinite}
  #screenBooth::before{left:15%}#screenBooth::after{right:15%;background:#ff5ce1;box-shadow:0 0 8px #ff5ce1}
  #screen .live{position:absolute;left:3%;top:5%;z-index:4;background:#e01b1b;color:#fff;font-weight:800;
    font-size:calc(var(--u0)*2);padding:1px 7px;border-radius:5px;letter-spacing:.6px;animation:pulse 1.6s infinite}
  #screen .title{position:absolute;left:3%;top:19%;z-index:4;color:#ffe9ff;font-weight:900;font-size:calc(var(--u0)*3.1);
    text-shadow:0 0 10px #ff2eaa,0 2px 4px #000;letter-spacing:.5px}
  /* lưới chấm LED + scanline phủ lên nội dung màn cho ra chất màn hình thật */
  #screenScan{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(rgba(0,0,0,.20) 1px,transparent 1.4px),repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
    background-size:4px 4px,100% 100%;animation:scanFlk 3.4s ease-in-out infinite}
  @keyframes scanFlk{0%,100%{opacity:.85}50%{opacity:1}}
  #screenFocus{position:absolute;inset:0;z-index:4;display:flex;align-items:center;gap:4%;padding:2.5% 4% 13%;box-sizing:border-box;
    background:radial-gradient(120% 120% at 50% 0%,#5b1a86,#1c0636 78%);opacity:0;pointer-events:none;transition:opacity .4s}
  #screenFocus.on{opacity:1}
  #screenFocus img{height:96%;filter:drop-shadow(0 0 14px rgba(255,215,106,.8))}
  #screenFocus .sf-name{font-weight:900;font-size:calc(var(--u0)*3.6);line-height:1.15;color:#fff;text-shadow:0 2px 5px #000;word-break:break-word}
  #screenFocus .sf-sub{font-weight:800;font-size:calc(var(--u0)*2.6);color:#ffd76a;margin-top:3%;text-shadow:0 1px 3px #000}
  #screenTicker{position:absolute;left:0;right:0;bottom:0;height:13.5%;z-index:5;background:rgba(5,2,16,.88);
    border-top:1px solid rgba(255,150,230,.6);overflow:hidden;display:flex;align-items:center}
  #screenTicker .tk{display:flex;white-space:nowrap;animation:tickMove 26s linear infinite;will-change:transform}
  #screenTicker span{color:#ffe3fb;font-weight:700;font-size:calc(var(--u0)*2.3);padding-right:calc(var(--u0)*3)}
  @keyframes tickMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ================= OVERLAY NGOÀI CAMERA ================= */
  #banner{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);z-index:1700;pointer-events:none;
    background:linear-gradient(100deg,#6a1bb0,#d81bb0 55%,#6a1bb0);color:#fff;font-weight:800;letter-spacing:.4px;text-align:center;
    font-size:calc(var(--u0)*3);padding:calc(var(--u0)*1.1) calc(var(--u0)*3.2);border-radius:999px;max-width:88%;
    border:2px solid rgba(255,220,150,.9);box-shadow:0 6px 24px rgba(40,0,80,.55),0 0 18px rgba(255,80,220,.5);
    opacity:0;transition:opacity .35s,transform .35s}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #bigtext{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1680;pointer-events:none;text-align:center;
    font-size:calc(var(--u0)*8.6);font-weight:900;letter-spacing:1px;line-height:1.12;color:#ffe14d;opacity:0;white-space:nowrap;
    text-shadow:0 0 8px #ff9d2e,0 0 26px #ff2eaa,0 4px 6px rgba(0,0,0,.6)}
  #bigtext.on{animation:bigZoom 2.8s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes bigZoom{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
  #judge{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);z-index:1650;pointer-events:none;
    font-size:calc(var(--u0)*5.2);font-weight:900;letter-spacing:1px;opacity:0;color:#fff}
  #judge.pop{animation:judgePop .8s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  #judge.perfect{color:#ffd76a;text-shadow:0 0 14px #ffb52e,0 2px 4px #000a}
  #judge.great{color:#7ed6ff;text-shadow:0 0 14px #2e9bff,0 2px 4px #000a}
  #judge.cool{color:#b8f26d;text-shadow:0 0 12px #5cb82e,0 2px 4px #000a}
  #judge.bad{color:#ffb35c;text-shadow:0 0 12px #e07b2e,0 2px 4px #000a}
  #judge.miss{color:#ff8fa5;text-shadow:0 0 12px #e03550,0 2px 4px #000a}
  /* lower-third kiểu truyền hình: camera đang bám ai + vì sao */
  #camtab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*21.5);z-index:2050;pointer-events:none;text-align:center;
    background:linear-gradient(100deg,rgba(10,4,26,.93),rgba(90,20,140,.93));color:#fff;border:1px solid rgba(255,150,230,.75);
    border-left:calc(var(--u)*1.1) solid #e01b1b;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*1.8);
    font-size:calc(var(--u)*2.15);font-weight:800;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transition:opacity .35s;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #camtab.on{opacity:1}
  #camtab small{display:block;font-size:calc(var(--u)*1.7);font-weight:700;color:#ffd76a;letter-spacing:.6px}

  /* ---------- Dancer ---------- */
  .dancer{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform;
    transition:filter .45s ease,opacity .45s ease}
  /* LÀM MỜ KHI LIA CAM: main.js bật #world.focusing theo đạo diễn camera và gắn .is-focus cho
     dancer đang được lia; --dimB = hệ số sáng của phần còn lại (config doMoPhanConLai) */
  #world.focusing .dancer{filter:brightness(var(--dimB,.55)) saturate(.65);opacity:.82}
  #world.focusing .dancer.is-focus{filter:brightness(1.07) drop-shadow(0 0 14px rgba(255,230,150,.55));opacity:1}
  .dancer .figwrap{position:relative;z-index:1;filter:drop-shadow(0 5px 6px rgba(10,0,30,.45))}
  .dancer .figwrap img.chibi{height:var(--fh,120px);display:block}
  .dancer.onstage .figwrap{filter:drop-shadow(0 0 12px rgba(255,215,106,.8)) drop-shadow(0 5px 7px rgba(10,0,30,.4))}
  .dancer.paired .figwrap{filter:drop-shadow(0 0 13px rgba(255,110,200,.95)) drop-shadow(0 5px 7px rgba(10,0,30,.4))}
  .dancer.focused .figwrap,.dancer.vis-xung .figwrap{filter:drop-shadow(0 0 15px rgba(255,240,190,.9)) drop-shadow(0 5px 7px rgba(10,0,30,.4))}
  .dancer.vis-spot .figwrap{filter:drop-shadow(0 0 22px rgba(255,215,106,1)) drop-shadow(0 6px 9px rgba(10,0,30,.4))}
  #stage.partymax .dancer{filter:brightness(1.1)}
  /* đang rơi: nghiêng nhẹ + sáng */
  .dancer.falling .figwrap{animation:fallTilt .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px rgba(255,255,255,.85)) drop-shadow(0 8px 10px rgba(10,0,30,.4))}
  @keyframes fallTilt{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  /* chạm đất: nảy squash & stretch */
  .dancer.landed .figwrap{animation:squash .5s cubic-bezier(.3,1.6,.4,1)}
  @keyframes squash{0%{transform:scale(1.14,.78)}35%{transform:scale(.94,1.1)}65%{transform:scale(1.04,.96)}100%{transform:scale(1,1)}}
  /* nhân viên rời sàn */
  .dancer.bye{opacity:0;transition:opacity .7s ease;pointer-events:none}
  /* lớp PHỤ KIỆN trống (TODO giai đoạn trang phục/phụ kiện theo LV — xem README) */
  .dancer .acc{position:absolute;inset:0;z-index:2;pointer-events:none}
  /* vòng hào quang LV dưới chân: t0 ẩn · t1 đồng · t2 bạc · t3 vàng · t4 cầu vồng */
  .dancer .auraring{position:absolute;left:50%;bottom:calc(var(--fh,120px)*.13);transform:translateX(-50%);z-index:0;
    width:calc(var(--fh,120px)*.98);height:calc(var(--fh,120px)*.17);border-radius:50%;pointer-events:none;display:none}
  .dancer .auraring.t1{display:block;border:2px solid rgba(216,140,80,.95);box-shadow:0 0 10px rgba(216,140,80,.6)}
  .dancer .auraring.t2{display:block;border:2px solid rgba(225,235,245,.95);box-shadow:0 0 12px rgba(200,225,255,.75)}
  .dancer .auraring.t3{display:block;border:2px dashed rgba(255,215,106,.95);box-shadow:0 0 14px rgba(255,215,106,.8),inset 0 0 10px rgba(255,215,106,.4);animation:ringSpin calc(6s * var(--spd,1)) linear infinite}
